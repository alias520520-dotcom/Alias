    <script>
        // 页面加载需要时间会影响导航的准确性
        setTimeout(() => {
            const ct = document.querySelector('.article-content');  //".post-content"指向文章内容所在的div，需根据实际情况修改
            scrollnav.init(ct, {
                debug: false,
                easingStyle: 'linear',
                //section为一级目录，subsection为二级目录
                //以下两行意为h3为一级目录，h4为二级目录（个人只需要一级目录，所以注释了二级目录）
                sections: ($('.article-content > h1').length > 0) ? 'h1' : 'h2',
                subSections: ($('.post-content > h1').length > 0) ? 'h2' : 'h3',
            });
        }, 1200)

        var menu = document.querySelector("nav.site-nav");
        var checkbox = document.getElementById("nav-trigger");

        var pic;
        var imgPicture;
        // close menu if click outside menu
        document.addEventListener("click", function (e) {
            if (e.target.nodeName === 'IMG' && e.target.className !== 'hoverImg') {
                imgPicture = e.target.currentSrc;
                showImg(e.target.currentSrc);
            }
            if (['shade', 'hoverImg'].includes(e.target.className)) {
                hiddenImg(e.target.currentSrc);
            }
            if (menu != e.target &&
                !isDescendant(menu, e.target)) {
                checkbox.checked = false;
            }
        }, false);

        function showImg(imgSrc) {
            let shade = document.getElementsByClassName("shade");
            shade[0].style = 'display: block';
            pic = document.createElement('img');
            pic.setAttribute("class", "hoverImg");
            pic.src = imgSrc;
            document.body.appendChild(pic);
        }

        function hiddenImg(imgSrc) {
            document.body.removeChild(pic);
            let shade = document.getElementsByClassName("shade");
            shade[0].style = 'display: none';
        }

        function isDescendant(parent, child) {
            var node = child.parentNode;
            while (node != null) {
                if (node == parent) {
                    return true;
                }
                node = node.parentNode;
            }
            return false;
        }
        window.onscroll = function () {
            let isArticlePage = document.getElementsByClassName("artile-detail").length > 0
                && document.getElementsByClassName("hoverImg").length > 0;
            if (isArticlePage) {
                hiddenImg(imgPicture);
            }
        }  
    </script>
